/* ===== Japanese clean iOS polish layer ===== */
:root{
 --jp-cream:#f7f5f0;--jp-sage:#dce7dd;--jp-mint:#e7f0e8;
 --jp-ink:#23332d;--jp-glass:rgba(255,255,255,.30);
}
html,body{background:#e9e8e2}
body{background:
 radial-gradient(ellipse at 18% 18%,rgba(255,255,255,.95),transparent 34%),
 radial-gradient(ellipse at 82% 80%,rgba(193,211,194,.55),transparent 35%),
 #e9e8e2}
#phone{
 background:#dce7dd;
 color:#fff;
 transition:background .35s ease;
}
.wallpaper{
 background-image:
  radial-gradient(ellipse at 50% 22%,rgba(255,255,255,.44),transparent 40%),
  linear-gradient(155deg,rgba(27,54,43,.04),rgba(19,41,35,.24)),
  var(--wallpaper);
 background-size:cover;background-position:center;
 transform:scale(1.015);
 animation:wallpaperBreathe 18s ease-in-out infinite alternate;
}
.wallpaper:after{
 background:
  linear-gradient(180deg,rgba(12,25,21,.05),transparent 32%,rgba(12,25,21,.12)),
  radial-gradient(ellipse at 50% 100%,rgba(10,20,16,.20),transparent 55%);
}
@keyframes wallpaperBreathe{from{transform:scale(1.015)}to{transform:scale(1.055)}}

#lock.active{animation:lockAppear .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes lockAppear{from{opacity:0;transform:translateY(-28px) scale(.99);filter:blur(2px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}

let unlockInProgress = false;
const PHONE_PASSCODE = '0525';
let enteredPasscode = '';
let passcodeResetTimer = 0;

function openPasscode() {
  const screen = $('#passcodeScreen');
  if (!screen || unlockInProgress) return;
  window.clearTimeout(passcodeResetTimer);
  enteredPasscode = '';
  renderPasscodeDots();
  const error = $('#passcodeError');
  if (error) error.textContent = '';
  screen.style.removeProperty('display');
  screen.classList.add('active');
  screen.setAttribute('aria-hidden', 'false');
}

function closePasscode() {
  const screen = $('#passcodeScreen');
  window.clearTimeout(passcodeResetTimer);
  enteredPasscode = '';
  renderPasscodeDots();
  const error = $('#passcodeError');
  if (error) error.textContent = '';
  if (screen) {
    screen.classList.remove('active');
    screen.setAttribute('aria-hidden', 'true');
    screen.style.removeProperty('display');
  }
}

function renderPasscodeDots() {
  const container = $('#passcodeDots');
  if (!container) return;
  const dots = container.querySelectorAll('.passcode-dot');
  dots.forEach((dot, index) => {
    const filled = index < enteredPasscode.length;
    dot.classList.toggle('filled', filled);
    // Fill via ::after instead of background-color, so global button/input styles cannot override it.
    dot.style.setProperty('--passcode-dot-filled', filled ? '1' : '0');
    dot.style.removeProperty('background-color');
    dot.style.borderColor = '#fff';
    dot.style.opacity = '1';
    dot.style.boxShadow = 'none';
  });
  container.setAttribute('aria-label', `已輸入密碼 ${enteredPasscode.length} 位`);
}

function enterPasscodeDigit(digit) {
  if (!/^[0-9]$/.test(String(digit)) || enteredPasscode.length >= 4) return;
  window.clearTimeout(passcodeResetTimer);
  const error = $('#passcodeError');
  if (error) error.textContent = '';
  enteredPasscode += String(digit);
  renderPasscodeDots();

  if (enteredPasscode.length !== 4) return;

  if (enteredPasscode === PHONE_PASSCODE) {
    closePasscode();
    unlock();
    return;
  }

  const container = $('#passcodeDots');
  if (container && typeof container.animate === 'function') {
    try {
      container.animate(
        [{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' },
         { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }],
        { duration: 240, easing: 'ease-out' }
      );
    } catch (_) {}
  }
  if (error) error.textContent = '密碼錯誤，請再試一次';
  passcodeResetTimer = window.setTimeout(() => {
    enteredPasscode = '';
    renderPasscodeDots();
  }, 650);
}

function unlock() {
  const lock = $('#lock');
  const home = $('#home');
  const appView = $('#appView');
  if (unlockInProgress || !lock || !home) return;
  unlockInProgress = true;
  window.clearTimeout(passcodeResetTimer);
  lock.classList.add('unlocking');

  const finish = () => {
    lock.classList.remove('active', 'unlocking', 'dragging');
    lock.style.transform = '';
    lock.style.opacity = '';
    home.classList.add('active');
    if (appView) appView.classList.remove('active');
    unlockInProgress = false;
  };

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    finish();
  } else {
    window.setTimeout(finish, 260);
  }
}

 recentAppReturnAt=outgoing===app?Date.now():0;
 closeAudio();stopCall();
 if(outgoing){
  outgoing.classList.remove('leaving-to-lock');
  void outgoing.offsetWidth;
  outgoing.classList.add('leaving-to-lock');
  const finish=()=>{outgoing.classList.remove('active','leaving-to-lock');outgoing.removeEventListener('animationend',finish);};
  outgoing.addEventListener('animationend',finish);
  window.setTimeout(finish,420);
 }
 lock.classList.add('active');
}
function returnToRecentApp(){

 if(!lock?.classList.contains('active') || app?.classList.contains('active')) return false;

 lock.style.transform='';lock.style.opacity='';lock.style.transition='';

}

  function draw(){

   overlay.innerHTML=`<div class="line-call-screen ${incoming?'is-incoming':''} ${active?'is-active':''} ${ended||unanswered?'is-ended':''}"><div class="line-call-top"><button type="button" class="line-call-back" aria-label="返回">⌄</button><div class="line-call-brand"><span class="line-call-brand-mark">LINE</span></div><button type="button" class="line-call-more" aria-label="切換來電示範">•••</button></div><div class="line-call-person"><div class="line-call-avatar-wrap"><div class="line-call-avatar">${escapeHTML(initial)}</div></div><div class="line-call-name">${escapeHTML(currentFriend||"好友")}</div><div class="line-call-status">${status}</div></div>${ended||unanswered?`<div class="line-call-bottom call-result-actions"><div class="line-call-result-message">${unanswered?'對方沒有接聽，請稍後再試':'本次通話已結束'}</div><button type="button" class="line-call-result-close">完成</button></div>`:incoming?`<div class="line-call-bottom incoming-actions"><button type="button" class="line-call-answer" aria-label="接聽來電">${phoneSvg}<small>接聽</small></button><button type="button" class="line-call-decline" aria-label="拒絕來電">${phoneSvg}<small>拒絕</small></button></div>`: `<div class="line-call-bottom"><div class="line-call-controls">${active?`<button type="button" class="line-call-control speaker"><span>${icon('speaker')}</span><small>擴音</small></button><button type="button" class="line-call-control mute"><span>${icon('mute')}</span><small>靜音</small></button><button type="button" class="line-call-control keypad"><span>${icon('keypad')}</span><small>按鍵</small></button>`:''}</div>${active?'': '<button type="button" class="line-call-secondary">模擬接通</button>'}<button type="button" class="line-call-end" aria-label="${active?'結束通話':'取消通話'}">${phoneSvg}</button><div class="line-call-end-label">${active?'結束通話':'取消'}</div></div>`}</div>`;
   overlay.querySelector('.line-call-back').onclick=()=>{if(timer)clearInterval(timer);if(noAnswerTimer)clearTimeout(noAnswerTimer);overlay.remove()};
   overlay.querySelector('.line-call-more').onclick=()=>{state=state==='incoming'?'outgoing':'incoming';draw()};

   if(state==='outgoing')noAnswerTimer=setTimeout(()=>{if(state==='outgoing'&&overlay.isConnected){state='unanswered';draw()}},25000);
  }
  draw();
 }else{

 }

}

 render();
 $('#appContent').addEventListener('input',function(e){

 });
 $('#appContent').addEventListener('submit',function(e){
  if(e.target.id==="x2ChatForm"){e.preventDefault();const input=$('#x2ChatInput'),text=input.value.trim();if(!text)return;chatMessages.push({text,mine:true});conversations[currentChat].text=text;render();const sc=$('#x2ChatScroll');if(sc)sc.scrollTop=sc.scrollHeight}
 });
 $('#appContent').addEventListener('click',function(e){
  const b=e.target.closest('button,[data-action="trend"]');if(!b)return;
  const action=b.dataset.action;
  if(action==="tab"||["home","search","notifications","messages","profile"].includes(action)){activeTab=action==="tab"?b.dataset.tab:action;currentChat=-1;render();return}
  if(action==="compose"){modal="compose";draft="";render();$('#x2Draft')?.focus();return}
  if(action==="close-modal"){if(e.target.closest('[data-modal]')&&!e.target.closest('button'))return;modal="";render();return}
  if(action==="publish"){if(!draft.trim())return;posts.unshift({id:Date.now(),text:draft.trim(),when:"現在",likes:0,replies:0,reposts:0});modal="";activeTab="home";searchTerm="";render();notify("貼文已發佈");return}
  if(action==="like"){const id=b.dataset.id;liked[id]=!liked[id];render();return}
  if(action==="repost"){const id=b.dataset.id;reposted[id]=!reposted[id];render();notify(reposted[id]?"已轉發貼文":"已取消轉發");return}
  if(action==="save"){const id=b.dataset.id;saved[id]=!saved[id];render();notify(saved[id]?"已加入書籤":"已移除書籤");return}
  if(action==="reply"){modal="reply";draft=b.dataset.id;render();$('#x2ReplyText')?.focus();return}
  if(action==="send-reply"){const text=$('#x2ReplyText')?.value.trim();if(!text){notify("請先輸入回覆");return}const p=posts.find(p=>String(p.id)===String(draft));if(p)p.replies++;posts.unshift({id:Date.now(),text:"↳ "+text,when:"現在",likes:0,replies:0,reposts:0});modal="";activeTab="home";render();notify("回覆已送出");return}
  if(action==="share"){const p=posts.find(p=>String(p.id)===String(b.dataset.id));if(p&&navigator.clipboard?.writeText)navigator.clipboard.writeText(p.text).then(()=>notify("貼文內容已複製")).catch(()=>notify(p.text));else notify(p?p.text:"分享");return}
  if(action==="views"){notify("此貼文的瀏覽次數："+([120,87,214][Number(b.dataset.id)%3]||0));return}
  if(action==="postmore"){modal="";const id=b.dataset.id;saved[id]=!saved[id];render();notify(saved[id]?"已加入書籤":"已移除書籤");return}
  if(action==="settings"||action==="profile-menu"){notify("帳號設定：通知、隱私與顯示選項");return}
  if(action==="edit-profile"){modal="edit";render();return}
  if(action==="save-profile"){editName=$('#x2EditName')?.value.trim()||me;editBio=$('#x2EditBio')?.value.trim()||"";modal="";render();notify("個人資料已更新");return}
  if(action==="clear-notifications"){notifications=[];render();notify("通知已清除");return}
  if(action==="notification"){notify("已開啟通知");return}
  if(action==="notiftab"){notify("已切換通知分類");return}
  if(action==="feed"){notify("已切換動態牆分類");return}
  if(action==="profile-posts"){notify("顯示個人貼文分類");return}
  if(action==="trend"){searchTerm=b.textContent.trim();activeTab="search";render();return}
  if(action==="open-chat"){currentChat=Number(b.dataset.index);conversations[currentChat].unread=false;chatMessages=[];render();return}
  if(action==="chat-back"){currentChat=-1;render();return}
  if(action==="chat-info"){notify("對話設定與參與者資訊");return}
  if(action==="new-message"){notify("選擇一位聯絡人即可開始新對話");return}
 });
}

   ['position','left','top','width','height','margin','pointer-events','z-index','transform'].forEach(k=>draggedIcon.style.removeProperty(k));
  }
  if(placeholder)placeholder.remove();
  placeholder=null;
  icons().forEach(el=>el.classList.remove('drop-target'));
  dragging=false;draggedIcon=null;
 }
 function beginDrag(icon,x,y){
  setEditMode(true);draggedIcon=icon;dragging=true;
  const r=icon.getBoundingClientRect();dragOffsetX=x-r.left;dragOffsetY=y-r.top;
  placeholder=document.createElement('div');placeholder.className='home-icon-placeholder';
  placeholder.style.width=r.width+'px';placeholder.style.height=r.height+'px';
  placeholder.style.minWidth='0';
  icon.parentElement.insertBefore(placeholder,icon);
  icon.classList.add('dragging-app');
  Object.assign(icon.style,{position:'fixed',left:(x-dragOffsetX)+'px',top:(y-dragOffsetY)+'px',width:r.width+'px',height:r.height+'px',margin:'0',pointerEvents:'none',zIndex:'9999',transform:'scale(1.08)'});
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
 }
 function positionPlaceholder(x,y){
  if(!draggedIcon||!placeholder)return;
  const target=document.elementFromPoint(x,y);
  const targetIcon=target&&target.closest?target.closest('#appGrid .app-icon'):null;
  const targetPage=target&&target.closest?target.closest('#appGrid .home-app-page'):null;
  if(targetIcon&&targetIcon!==draggedIcon){
   const r=targetIcon.getBoundingClientRect();
   const before=y<r.top+r.height/2;
   const parent=targetIcon.parentElement,reference=before?targetIcon:targetIcon.nextSibling;
   if(placeholder.parentElement!==parent||placeholder!==reference)parent.insertBefore(placeholder,reference);
   targetIcon.classList.add('drop-target');
   icons().forEach(el=>{if(el!==targetIcon)el.classList.remove('drop-target')});
  }else if(targetPage&&!targetIcon){
   icons().forEach(el=>el.classList.remove('drop-target'));
   const children=Array.from(targetPage.querySelectorAll('.app-icon')).filter(el=>el!==draggedIcon);
   if(!children.length)targetPage.appendChild(placeholder);
   else{
    let nearest=children[0],best=Infinity;
    children.forEach(el=>{const r=el.getBoundingClientRect(),d=Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2));if(d<best){best=d;nearest=el}});
    const r=nearest.getBoundingClientRect(),before=(y<r.top+r.height/2);
    targetPage.insertBefore(placeholder,before?nearest:nearest.nextSibling);
   }
  }
  const r=grid.getBoundingClientRect(),edge=30;
  let dir=0;if(x<r.left+edge)dir=-1;else if(x>r.right-edge)dir=1;
  if(dir&&dir!==lastEdge){
   clearEdge();lastEdge=dir;
   edgeTimer=setTimeout(()=>{
    const max=Math.max(0,grid.scrollWidth-grid.clientWidth);
    grid.scrollTo({left:dir<0?Math.max(0,grid.scrollLeft-grid.clientWidth):Math.min(max,grid.scrollLeft+grid.clientWidth),behavior:'smooth'});
    edgeTimer=0;lastEdge=0;
   },420);
  }else if(!dir)clearEdge();
 }
 document.addEventListener('pointerdown',e=>{
  if(!home.classList.contains('active')||e.button!==undefined&&e.button!==0&&e.pointerType==='mouse')return;
  const icon=e.target.closest&&e.target.closest('#appGrid .app-icon');
  const insideHome=home.contains(e.target);
  if(!insideHome)return;
  // End edit mode on the first tap anywhere except a Home Screen app or Done.
  if(editMode&&!icon&&!(e.target.closest&&e.target.closest('.home-edit-done'))){
   setEditMode(false);
   pressedIcon=null;clearPress();
   return;
  }
  pressedIcon=icon;startX=e.clientX;startY=e.clientY;moved=false;
  clearPress();
  if(icon){
   pressTimer=setTimeout(()=>beginDrag(icon,startX,startY),420);
  }else if(!editMode&&!e.target.closest('.status,.widgets,.dock,#homePageDots')){
   pressTimer=setTimeout(()=>setEditMode(true),520);
  }
 },{capture:true});
 document.addEventListener('pointermove',e=>{
  if(!pressedIcon&&!pressTimer)return;
  const dx=e.clientX-startX,dy=e.clientY-startY;
  if(Math.abs(dx)>12||Math.abs(dy)>12)moved=true;
  if(!dragging&&moved)clearPress();
  if(dragging&&draggedIcon){
   if(e.cancelable)e.preventDefault();
   draggedIcon.style.left=(e.clientX-dragOffsetX)+'px';draggedIcon.style.top=(e.clientY-dragOffsetY)+'px';
   positionPlaceholder(e.clientX,e.clientY);
  }
 },{capture:true,passive:false});
 function endPointer(){
  clearPress();
  if(dragging){finishDrag();saveOrder();updateDots()}
  pressedIcon=null;moved=false;
 }
 document.addEventListener('pointerup',endPointer,{capture:true});
 document.addEventListener('pointercancel',endPointer,{capture:true});
 document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('#home'))e.preventDefault()});
 document.addEventListener('click',e=>{
  if(!editMode)return;
  if(e.target.closest&&e.target.closest('.home-edit-done'))return;
  const icon=e.target.closest&&e.target.closest('#appGrid .app-icon');
  if(icon){e.preventDefault();e.stopImmediatePropagation();return}
  setEditMode(false);
 },true);
 grid.addEventListener('scroll',updateDots,{passive:true});
 restoreOrder();
})();


/* ===== Interaction polish: subtle app launch, toast notifications, keyboard/back gestures ===== */
(function(){
 const phone=document.querySelector('#phone');
 if(!phone)return;
 let toastTimer=null;
 function toast(title,body,icon='✦'){
   const old=document.querySelector('.jp-toast');
   if(old){old.style.animation='toastOut .2s ease both';setTimeout(()=>old.remove(),180)}
   const el=document.createElement('div');el.className='jp-toast';
   el.innerHTML='<div class="jp-toast-icon">'+icon+'</div><div style="min-width:0;flex:1"><div style="font-weight:700;font-size:13px;margin-bottom:3px">'+safe(title)+'</div><div style="color:#69716b;line-height:1.35">'+safe(body)+'</div></div><div style="font-size:11px;color:#7b827d;align-self:flex-start">now</div>';
   phone.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.style.animation='toastOut .3s ease both';setTimeout(()=>el.remove(),280)},3500);
 }
 function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 document.addEventListener('click',e=>{
   const app=e.target.closest('[data-app]');
   if(app){
     const name=(app.getAttribute('aria-label')||app.dataset.app||'App').replace(/[-_]/g,' ');

 });
 const home=document.querySelector('#appHomebar');
 if(home){

 }
 document.addEventListener('keydown',e=>{

     const full=document.querySelector('#fullPlayer');

 });
 // Show a small welcoming notification only once per page load; it is purely decorative.
 setTimeout(()=>{
   if(document.querySelector('#lock.active'))toast('拾得物・お知らせ','スワイプしてロックを解除','⌁');
 },2200);
 // Enhance home gesture on the lock screen without overriding existing unlock handlers.
 let sx=0,sy=0;
 document.querySelectorAll('#home,#appView').forEach(surface=>{
   surface.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
   surface.addEventListener('touchend',e=>{
     const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
     if(Math.abs(dx)>100&&Math.abs(dx)>Math.abs(dy)*1.4){
       // Native-feeling edge gesture: left-to-right from an app returns to the home screen.
       if(dx>0&&sx<32&&surface.id==='appView'&&typeof goHome==='function')goHome();
     }
   },{passive:true});
 });
 // Swipe down on the home screen to return to the lock screen without asking for a passcode.
 const homeSurface=document.querySelector('#home');
 if(homeSurface){
   let homeSwipeStart=null;
   homeSurface.addEventListener('touchstart',e=>{
     homeSwipeStart=e.changedTouches[0]?.clientY ?? null;
   },{passive:true});
   homeSurface.addEventListener('touchend',e=>{
     if(homeSwipeStart===null)return;
     const end=e.changedTouches[0]?.clientY ?? homeSwipeStart;
     const delta=end-homeSwipeStart;
     homeSwipeStart=null;
     if(delta>Math.max(35,window.innerHeight*.05) && typeof showLock==='function')showLock();
   },{passive:true});
   homeSurface.addEventListener('touchcancel',()=>{homeSwipeStart=null;},{passive:true});
   let homePointerStart=null;
   homeSurface.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;homePointerStart=e.clientY;},{passive:true});
   homeSurface.addEventListener('pointerup',e=>{
     if(homePointerStart===null)return;
     const delta=e.clientY-homePointerStart;homePointerStart=null;
     if(delta>Math.max(35,window.innerHeight*.05)&&typeof showLock==='function')showLock();
   },{passive:true});
   homeSurface.addEventListener('pointercancel',()=>{homePointerStart=null;},{passive:true});
 }
 // Capture swipe-down gestures at document level so app-internal handlers cannot swallow them.
 let appSwipeStart=null;
 const appIsVisible=()=>document.querySelector('#appView')?.classList.contains('active')
   && !document.querySelector('#lock')?.classList.contains('active')
   && !document.querySelector('#home')?.classList.contains('active')
   && !document.querySelector('#passcodeScreen')?.classList.contains('active')
   && !document.querySelector('#controlCenter')?.classList.contains('active');
 document.addEventListener('touchstart',e=>{
   if(!appIsVisible()){appSwipeStart=null;return;}
   const t=e.changedTouches[0];
   appSwipeStart=t?{y:t.clientY,x:t.clientX}:null;
 },{passive:true,capture:true});
 document.addEventListener('touchend',e=>{
   if(!appSwipeStart||!appIsVisible())return;
   const t=e.changedTouches[0];
   const dy=(t?t.clientY:appSwipeStart.y)-appSwipeStart.y;
   const dx=Math.abs((t?t.clientX:appSwipeStart.x)-appSwipeStart.x);
   appSwipeStart=null;
   if(dy>Math.max(40,window.innerHeight*.045)&&dy>dx*1.15&&appIsVisible())showLock();
 },{passive:true,capture:true});
 document.addEventListener('touchcancel',()=>{appSwipeStart=null;},{passive:true,capture:true});
 let appPointerStart=null;
 document.addEventListener('pointerdown',e=>{
   if(e.pointerType==='mouse'&&e.button!==0)return;
   if(!appIsVisible()){appPointerStart=null;return;}
   appPointerStart={y:e.clientY,x:e.clientX};
 },{passive:true,capture:true});
 document.addEventListener('pointerup',e=>{
   if(!appPointerStart||!appIsVisible())return;
   const dy=e.clientY-appPointerStart.y,dx=Math.abs(e.clientX-appPointerStart.x);
   appPointerStart=null;
   if(dy>Math.max(40,window.innerHeight*.045)&&dy>dx*1.15&&appIsVisible())showLock();
 },{passive:true,capture:true});
 document.addEventListener('pointercancel',()=>{appPointerStart=null;},{passive:true,capture:true});
 // Keep the app usable in standalone/full-screen Safari and desktop browsers.
 document.documentElement.style.webkitTapHighlightColor='transparent';
})();


(function(){
  const $ = (selector) => document.querySelector(selector);
  const phone = $('#phone');
  const cc = $('#controlCenter');
  if (!phone || !cc) return;

  const closeCC = () => { cc.classList.remove('active'); cc.setAttribute('aria-hidden', 'true'); };
  const openCC = () => { cc.classList.add('active'); cc.setAttribute('aria-hidden', 'false'); };

  function setFlashlight(enabled) {
    phone.classList.toggle('flashlight-on', Boolean(enabled));
    document.querySelectorAll('[data-toggle="flashlight"]').forEach((b) => {
      b.classList.toggle('on', Boolean(enabled));
      b.setAttribute('aria-pressed', String(Boolean(enabled)));
    });
    const lockButton = $('#flashlightButton');
    if (lockButton) lockButton.setAttribute('aria-pressed', String(Boolean(enabled)));
  }

  // One delegated handler means all controls work consistently on touch and mouse.
  document.addEventListener('click', (e) => {
    if (e.target.closest('.status')) { e.preventDefault(); openCC(); return; }
    if (e.target.closest('#ccDone, #ccClose')) { e.preventDefault(); closeCC(); return; }
    const tile = e.target.closest('[data-toggle]');
    if (tile) {
      const enabled = !tile.classList.contains('on');
      document.querySelectorAll('[data-toggle="' + tile.dataset.toggle + '"]').forEach((button) => {
        button.classList.toggle('on', enabled);
        button.setAttribute('aria-pressed', String(enabled));
      });
      if (tile.dataset.toggle === 'flashlight') setFlashlight(enabled);
      return;
    }
    if (e.target.closest('#flashlightButton')) {
      e.preventDefault(); setFlashlight(!phone.classList.contains('flashlight-on')); return;
    }
    if (e.target.closest('#lockCameraButton')) {
      e.preventDefault();
      const lock = $('#lock');
      if (lock && lock.classList.contains('active')) {
        cameraReturnToLock = true;
        closePasscode();
        showApp('camera');
      } else {
        cameraReturnToLock = false;
        showApp('camera');
      }
    }
  });

  const brightness = $('#brightnessControl');
  if (brightness) {
    const applyBrightness = () => {
      const raw = Number(brightness.value);
      const value = Number.isFinite(raw) ? Math.max(0, Math.min(100, raw)) : 100;
      const fill = document.querySelector('#controlCenter .cc-brightness'); if(fill) fill.style.setProperty('--cc-fill', value+'%');
      phone.style.setProperty('--screen-brightness', String(value / 100));
      brightness.setAttribute('aria-valuenow', String(value));
      const output=$('#brightnessValue');if(output)output.textContent=value+'%';
    };
    brightness.addEventListener('input', applyBrightness);
    brightness.addEventListener('change', applyBrightness);
    // Reliable touch drag for vertical brightness slider on mobile browsers.
    const brightnessTrack = document.querySelector('#controlCenter .cc-brightness');
    if (brightnessTrack && !brightness.dataset.verticalDragReady) {
      brightness.dataset.verticalDragReady = '1';
      let draggingBrightness = false;
      const setBrightnessFromY = (clientY) => {
        const rect = brightnessTrack.getBoundingClientRect();
        if (!rect.height) return;
        const ratio = Math.max(0, Math.min(1, (rect.bottom - clientY) / rect.height));
        const min = Number(brightness.min) || 0;
        const max = Number(brightness.max) || 100;
        brightness.value = String(Math.round(min + ratio * (max - min)));
        applyBrightness();
      };
      // Track-level pointer handling avoids native range hit-testing conflicts on touch screens.
      brightnessTrack.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        draggingBrightness = true;
        event.preventDefault();
        try { brightnessTrack.setPointerCapture(event.pointerId); } catch (_) {}
        setBrightnessFromY(event.clientY);
      });
      brightnessTrack.addEventListener('pointermove', (event) => {
        if (!draggingBrightness) return;
        event.preventDefault();
        setBrightnessFromY(event.clientY);
      });
      const stopBrightnessDrag = () => { draggingBrightness = false; };
      brightnessTrack.addEventListener('pointerup', stopBrightnessDrag);
      brightnessTrack.addEventListener('pointercancel', stopBrightnessDrag);
      brightnessTrack.addEventListener('lostpointercapture', stopBrightnessDrag);
    }
    applyBrightness();
  }
  const volumeInputs=Array.from(document.querySelectorAll('#volumeControl,#volumeControl2'));
  function syncVolume(source){const slider=document.querySelector('#controlCenter .cc-volume');if(slider)slider.style.setProperty('--cc-fill',source.value+'%');volumeInputs.forEach(el=>{if(el!==source)el.value=source.value});['#volumeValue','#volumeValue2'].forEach(sel=>{const o=$(sel);if(o)o.textContent=source.value+'%'})}
  volumeInputs.forEach(el=>{el.addEventListener('input',()=>syncVolume(el));el.addEventListener('change',()=>syncVolume(el))});
  const ccPages=$('#ccPages'),ccIndicators=Array.from(document.querySelectorAll('#ccPageIndicator [data-page]'));
  if(ccPages){
    ccPages.addEventListener('scroll',()=>{const index=0;ccIndicators.forEach((b,i)=>b.classList.toggle('active',i===index))},{passive:true});
    ccIndicators.forEach(b=>b.addEventListener('click',()=>{ccPages.scrollTo({left:Number(b.dataset.page)*ccPages.clientWidth,behavior:'smooth'})}));
  }
  const play=$('#ccPlay');if(play)play.addEventListener('click',()=>{const playing=play.textContent==='Ⅱ';play.textContent=playing?'▶':'Ⅱ';const track=$('.cc-track small');if(track)track.textContent=playing?'選擇音樂以開始播放':'播放介面示範中'});
  const play2=$('#ccPlay2');if(play2)play2.addEventListener('click',()=>{const playing=play2.textContent==='Ⅱ';play2.textContent=playing?'▶':'Ⅱ';const track=$('.cc-track small');if(track)track.textContent=playing?'iPhone 上的音樂':'播放介面示範中'});
  // Media transport controls are interactive even though they are not toggle tiles.
  const mediaButtons=document.querySelectorAll('#controlCenter .cc-media-buttons button');
  mediaButtons.forEach((button,index)=>button.addEventListener('click',()=>{
    const track=document.querySelector('#controlCenter .cc-track b');
    const artist=document.querySelector('#controlCenter .cc-track small');
    if(index===0){if(track)track.textContent='上一首歌曲';if(artist)artist.textContent='播放佇列已切換'}
    if(index===2){if(track)track.textContent='下一首歌曲';if(artist)artist.textContent='播放佇列已切換'}
    if(index===1){const playButton=document.querySelector('#ccPlay2');if(playButton){const playing=playButton.textContent==='Ⅱ';playButton.textContent=playing?'▶':'Ⅱ';if(artist)artist.textContent=playing?'播放已暫停':'正在播放'}}
  }));
  const outputButton=document.querySelector('[data-toggle="volumeoutput"]');
  if(outputButton){outputButton.setAttribute('aria-label','切換音訊輸出');outputButton.setAttribute('aria-pressed','false')}
  const cameraTool=document.querySelector('[data-toggle="camera"]');if(cameraTool)cameraTool.addEventListener('click',()=>{closeCC();showApp('camera')});
  const notesTool=document.querySelector('[data-toggle="notes"]');if(notesTool)notesTool.addEventListener('click',()=>{closeCC();showApp('notes')});

  const weather = $('#lockWeather'), event = $('#lockEvent');
  if (weather) weather.textContent = (CONFIG.weather?.desc || '晴朗') + ' · ' + (CONFIG.weather?.temp || '24°');
  if (event) event.textContent = CONFIG.events?.[0]?.title || '今天沒有其他安排';

  // Face ID gesture: pull down from the top-right edge to open Control Center;
  // swipe up from anywhere in Control Center to dismiss it.
  let gestureStart = null;
  phone.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    gestureStart = {
      x: e.clientX,
      y: e.clientY,
      wasOpen: cc.classList.contains('active')
    };
  }, {passive:true});
  phone.addEventListener('pointerup', (e) => {
    if (!gestureStart) return;
    const start = gestureStart;
    gestureStart = null;
    const dx = e.clientX - start.x;
    const dy = e.clientY - start.y;
    const fromTopRight = start.y <= Math.max(64, window.innerHeight * 0.09)
      && start.x >= window.innerWidth * 0.72;
    if (start.wasOpen && dy < -55 && Math.abs(dy) > Math.abs(dx)) {
      closeCC();
    } else if (!start.wasOpen && fromTopRight && dy > 55 && Math.abs(dy) > Math.abs(dx)) {
      openCC();
    }
  }, {passive:true});
  phone.addEventListener('pointercancel', () => { gestureStart = null; }, {passive:true});
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && cc.classList.contains('active')) closeCC();
  });
})();;

</script>
