/* ===== Japanese clean iOS polish layer ===== */
:root{
 --jp-cream:#f7f5f0;--jp-sage:#dce7dd;--jp-mint:#e7f0e8;
 --jp-ink:#23332d;--jp-glass:rgba(255,255,255,.30);
}
html,body{background:#e9e8e2}
body{background:
 radial-gradient(ellipse at 18% 18%,rgba(255,255,255,.95),transparent 34%),
 radial-gradient(ellipse at 82% 80%,rgba(193,211,194,.55),transparent 35%),
 #e9e8e2}

 background:#dce7dd;
 color:#fff;
 transition:background .35s ease;
}
.wallpaper{
 background-image:
  radial-gradient(ellipse at 50% 22%,rgba(255,255,255,.44),transparent 40%),
  linear-gradient(155deg,rgba(27,54,43,.04),rgba(19,41,35,.24)),
  var(--wallpaper);
 background-size:cover;background-position:center;
 transform:scale(1.015);
 animation:wallpaperBreathe 18s ease-in-out infinite alternate;
}
.wallpaper:after{
 background:
  linear-gradient(180deg,rgba(12,25,21,.05),transparent 32%,rgba(12,25,21,.12)),
  radial-gradient(ellipse at 50% 100%,rgba(10,20,16,.20),transparent 55%);

function setupWallpaperPicker(){
 const input=$('#wallpaperFileInput');
 const wallpaper=$('#wallpaper'), lock=$('#lock'), home=$('#home');
 if(!input || input.dataset.bound) return;
 input.dataset.bound='1';
 function chooseWallpaper(){input.value='';input.click()}
 [wallpaper,lock,home].forEach(el=>el?.addEventListener('click',e=>{
   if(e.target!==el && e.target!==wallpaper) return;
   e.preventDefault();
   chooseWallpaper();
 }));
 input.addEventListener('change',()=>{
   const file=input.files&&input.files[0];
   if(!file) return;
   if(!file.type.startsWith('image/')) { alert('請選擇圖片檔案。'); return; }
   const reader=new FileReader();
   reader.onerror=()=>alert('圖片讀取失敗，請再試一次。');
   reader.onload=()=>{
     const img=new Image();
     img.onerror=()=>alert('無法開啟這張圖片，請換一張試試。');
     img.onload=()=>{
       try{
         const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
         const canvas=document.createElement('canvas');
         canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
         canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
         canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
         const data=canvas.toDataURL('image/jpeg',0.86);

       }catch(err){ alert('圖片太大，無法儲存。請改用較小的圖片。'); }
     };
     img.src=reader.result;
   };
   reader.readAsDataURL(file);
 });
}

let unlockInProgress = false;
const PHONE_PASSCODE = '0525';
let enteredPasscode = '';
let passcodeResetTimer = 0;
let passcodeSuccessAction = null;

function openPasscode() {
  const screen = $('#passcodeScreen');
  if (!screen || unlockInProgress) return;
  window.clearTimeout(passcodeResetTimer);
  enteredPasscode = '';
  renderPasscodeDots();
  const error = $('#passcodeError');
  if (error) error.textContent = '';
  screen.style.removeProperty('display');
  screen.classList.add('active');
  screen.setAttribute('aria-hidden', 'false');
}

function closePasscode() {
  const screen = $('#passcodeScreen');
  window.clearTimeout(passcodeResetTimer);
  passcodeSuccessAction = null;
  enteredPasscode = '';
  renderPasscodeDots();
  const error = $('#passcodeError');
  if (error) error.textContent = '';
  if (screen) {
    screen.classList.remove('active', 'hidden-album-passcode');
    screen.setAttribute('aria-hidden', 'true');
    screen.style.removeProperty('display');
    const title = screen.querySelector('.passcode-title'), subtitle = screen.querySelector('.passcode-subtitle');
    if (title) title.textContent = '輸入密碼';
    if (subtitle) subtitle.textContent = '輸入密碼以解鎖 iPhone';
  }
}

function renderPasscodeDots() {
  const container = $('#passcodeDots');
  if (!container) return;
  const dots = container.querySelectorAll('.passcode-dot');
  dots.forEach((dot, index) => {
    const filled = index < enteredPasscode.length;
    dot.classList.toggle('filled', filled);
    // Fill via ::after instead of background-color, so global button/input styles cannot override it.
    dot.style.setProperty('--passcode-dot-filled', filled ? '1' : '0');
    dot.style.removeProperty('background-color');
    dot.style.borderColor = '#fff';
    dot.style.opacity = '1';
    dot.style.boxShadow = 'none';
  });
  container.setAttribute('aria-label', `已輸入密碼 ${enteredPasscode.length} 位`);
}

function enterPasscodeDigit(digit) {
  if (!/^[0-9]$/.test(String(digit)) || enteredPasscode.length >= 4 ||
      !$('#passcodeScreen')?.classList.contains('active') || unlockInProgress) return;
  window.clearTimeout(passcodeResetTimer);
  const error = $('#passcodeError');
  if (error) error.textContent = '';
  enteredPasscode += String(digit);
  renderPasscodeDots();

  // iPhone-style behavior: validate automatically as soon as all four digits are entered.
  if (enteredPasscode.length === 4) {
    if (enteredPasscode === PHONE_PASSCODE) {
      const successAction = passcodeSuccessAction;
      passcodeSuccessAction = null;
      closePasscode();
      if (typeof successAction === 'function') {
        successAction();
      } else {
        unlock();
      }
      return;
    }

    const container = $('#passcodeDots');
    if (container && typeof container.animate === 'function') {
      try {
        container.animate(
          [
            { transform: 'translateX(0) scale(1, 1)' },
            { transform: 'translateX(-8px) scale(1.12, .9)' },
            { transform: 'translateX(7px) scale(.9, 1.12)' },
            { transform: 'translateX(-5px) scale(1.07, .95)' },
            { transform: 'translateX(3px) scale(.97, 1.04)' },
            { transform: 'translateX(0) scale(1, 1)' }
          ],
          { duration: 520, easing: 'cubic-bezier(.36,.07,.19,.97)', iterations: 1 }
        );
      } catch (_) {}
    }
    if (error) error.textContent = '';
    passcodeResetTimer = window.setTimeout(() => {
      enteredPasscode = '';
      renderPasscodeDots();
    }, 650);
  }
}

function unlock() {
  const lock = $('#lock');
  const home = $('#home');
  const appView = $('#appView');
  if (unlockInProgress || !lock || !home) return;
  unlockInProgress = true;
  window.clearTimeout(passcodeResetTimer);
  lock.classList.add('unlocking');

  const finish = () => {
    lock.classList.remove('active', 'unlocking', 'dragging');
    lock.style.transform = '';
    lock.style.opacity = '';
    home.classList.add('active');
    if (appView) appView.classList.remove('active');
    unlockInProgress = false;
  };

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    finish();
  } else {
    window.setTimeout(finish, 260);
  }
}

 const modal=()=>{if(!S.modal)return '';let body='';const p=allPosts().find(x=>x.id===S.editingId)||seed[0];if(S.modal==='story-view'){const st=S.storyViewing||{},liked=!!S.storyLikes[st.id];body='<div class="ig-story-full '+(S.storyPaused?'is-paused':'')+'" style="background:'+esc(st.color||'linear-gradient(145deg,#e9a7c2,#8679c7,#f1c8a1)')+'"><div class="ig-story-progress-list">'+(()=>{const owner=st.owner||st.name;const group=S.storyQueue.map((item,index)=>({item,index})).filter(x=>(x.item.owner||x.item.name)===owner);const current=group.findIndex(x=>x.index===S.storyQueueIndex);return group.map((x,i)=>'<div class="ig-story-progress '+(i<current?'is-complete':i===current?'current':'')+'"><i style="'+(i<current?'width:100%;':i===current?'animation-duration:'+(Math.max(0,S.storyRemaining)/1000)+'s;animation-play-state:'+(S.storyPaused?'paused':'running')+';':'width:0;')+'"></i></div>').join('')})()+'</div><div class="ig-story-author">'+avatar(st.face||'✨')+'<b>'+esc(st.name||'Instagram')+'</b><small>剛剛</small><button class="ig-story-close" data-action="close-modal" aria-label="關閉">×</button></div><div class="ig-story-tap-left" data-action="story-prev" aria-label="上一則限時動態"></div><div class="ig-story-tap-right" data-action="story-next" aria-label="下一則限時動態"></div><div class="ig-story-content"><span class="ig-story-emoji">'+esc(st.emoji||'')+'</span><div class="ig-story-message">'+esc(st.text||'分享你的此刻 ✨')+'</div></div><div class="ig-story-footer"><form class="ig-story-reply-form" id="ig-story-reply-form"><input name="reply" autocomplete="off" placeholder="傳送訊息…" aria-label="回覆限時動態"><button type="submit" aria-label="傳送回覆">➤</button></form><button class="ig-story-reaction '+(liked?'is-liked':'')+'" data-action="story-like" aria-label="按讚" aria-pressed="'+String(liked)+'">'+(liked?'♥':'♡')+'</button></div></div>';}else if(S.modal==='post-detail')body='<div class="ig-post-detail"><div class="ig-art" style="background:'+esc(p.color||'linear-gradient(135deg,#e9c7d8,#e9d8bd)'  else if(S.modal==='comments')body='<h2>留言</h2><div class="ig-comment-list">'+(S.comments[p.id]||[]).map(c=>'<p><b>'+esc(c.user)+'</b> '+esc(c.text)+'</p>').join('')+'</div><form id="ig-comment-form"><input name="comment" placeholder="新增留言..."><button type="submit">發佈</button></form>';
 else if(S.modal==='post-menu')body='<h2>貼文選項</h2>'+[['分享至…','share'],['複製連結','copy-link'],['隱藏貼文','hide-post'],['檢舉','report'],['取消','close-modal']].map(x=>'<button class="ig-modal-row" data-action="'+x[1]+'">'+x[0]+'</button>').join('');
 else if(S.modal==='share')body='<h2>分享</h2><p class="ig-muted">分享這則貼文給朋友</p>'+friends.slice(0,4).map(f=>'<button class="ig-modal-row" data-action="share-to" data-user="'+esc(f.name)+'">'+avatar(f.face)+' '+esc(f.name)+' <span>傳送</span></button>').join('')+'<button class="ig-modal-row" data-action="copy-link">複製連結</button>';
 else if(S.modal==='edit-profile')body='<h2>編輯個人檔案</h2><label class="ig-edit-avatar">'+avatar('🙂','large')+'<span>變更大頭貼</span></label><label>名稱<input id="ig-name" value="'+esc(S.displayName)+'"></label><label>用戶名稱<input id="ig-username" value="'+esc(S.username)+'"></label><label>自我介紹<textarea id="ig-bio">'+esc(S.bio)+'</textarea></label><button class="ig-modal-primary" data-action="save-profile">完成</button>';

 else if(S.modal==='info')body='<h2>對話資訊</h2><button class="ig-modal-row" data-action="mute-chat">靜音訊息</button><button class="ig-modal-row" data-action="block-user">封鎖帳號</button><button class="ig-modal-row" data-action="report">檢舉</button>';

function showApp(id){
  window.__activeAppId=id;
  // Reset the shared app container before every launch so no previous app overlay can survive.
  const view=$('#appView'),content=$('#appContent');
  if(content)content.replaceChildren();
  if(view){view.classList.remove('dark');view.classList.add('active')}
  $('#home').classList.remove('active');$('#lock').classList.remove('active');
  if(id==="fitness"){renderFitnessApp();return}
  if(id==="safari"){renderSafariApp();return}
  if(["clock","calendar","files","music"].includes(id)){renderUtilityApp(id);return}
  if(id==="instagram"){renderInstagramApp();return}
  if(id==="messages"){renderMessages();return}
  if(id==="camera"||id==="youtube"){renderSimple(id);return}
  if(id==="spotify"){renderSpotify();return}
  view.classList.toggle('dark',id==="x");
  if(id==="weather")renderWeatherApp();
  else if(id==="phone")renderPhone();
  else if(id==="line")renderLine();
  else if(id==="x")renderX();
  else if(id==="photos")renderPhotos();
  else if(id==="notes")renderNotes();
  else if(id==="maps")renderMaps();
  else if(id==="settings")renderSettings();
}

function renderUtilityApp(id){
  if(id==="clock"){renderIOSClock();return;}
  if(id==="calendar"){renderIOSCalendar();return;}
  const configs={
   clock:{title:"時鐘",icon:"◷",subtitle:"世界時鐘",body:`<div class="utility-clock" id="utilityClock"></div><div class="simple-card"><b>鬧鐘</b><p>尚未設定鬧鐘</p></div><div class="simple-card"><b>計時器</b><p>準備好時再開始計時</p></div>`},
   calendar:{title:"行事曆",icon:"31",subtitle:"今天的行程",body:`<div class="utility-calendar-date" id="utilityCalendarDate"></div><div class="simple-card"><b>今天</b><p>目前沒有其他安排</p></div><div class="simple-card"><b>提醒事項</b><p>把重要的事情留在這裡</p></div>`},
   files:{title:"檔案",icon:"📁",subtitle:"瀏覽",body:`<div class="simple-card"><b>最近項目</b><p>最近開啟的檔案會顯示在這裡</p></div><div class="simple-card"><b>iCloud Drive</b><p>尚未連接雲端檔案</p></div><div class="simple-card"><b>我的 iPhone</b><p>本機檔案</p></div>`},
   music:{title:"音樂",icon:"♫",subtitle:"現在就來聽點音樂",body:`<div class="simple-card"><b>最近播放</b><p>尚無播放紀錄</p></div><div class="simple-card"><b>你的音樂</b><p>新增喜歡的歌曲後，就能在這裡找到它們</p></div><button class="simple-action" id="openSpotify">開啟 Spotify</button>`}
  };
  const c=configs[id];if(!c)return;
  $('#home').classList.remove('active');$('#lock').classList.remove('active');$('#appView').classList.add('active');$('#appView').classList.remove('dark');
  $('#appContent').innerHTML=`<div class="page utility-app"><div class="nav"><button class="nav-button" id="utilityBack">‹ 主畫面</button><span>${c.icon}</span></div><div class="nav-title">${c.title}</div><div class="muted" style="margin:6px 0 22px">${c.subtitle}</div>${c.body}</div>`;
  $('#utilityBack').onclick=goHome;
  if(id==="clock"){const tick=()=>{const el=$('#utilityClock');if(el)el.textContent=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});};tick();window.setInterval(tick,30000);}
  if(id==="calendar")$('#utilityCalendarDate').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  if(id==="music")$('#openSpotify').onclick=()=>renderSpotify();
}
function goHome(){
  if(window.__activeAppId==="clock")stopIOSClockApp();
  window.__activeAppId=null;
  stopCall();closeAudio();
  const view=$('#appView'),content=$('#appContent');
  if(content)content.replaceChildren();
  if(view){view.classList.remove('active','dark');}
  $('#home').classList.add('active');
}

function doImport(files){

  });
 }

// iOS-inspired Home Screen editing: long-press the wallpaper or an icon, then drag to reorder.
(function(){
 const home=document.querySelector('#home'),grid=document.querySelector('#appGrid'),dots=document.querySelector('#homePageDots');
 if(!home||!grid||!dots)return;
 const STORAGE_KEY='jianghu.home.appOrder.v2';
 let editMode=false,pressTimer=0,edgeTimer=0,pressedIcon=null,draggedIcon=null,placeholder=null;
 let startX=0,startY=0,dragging=false,moved=false,dragOffsetX=0,dragOffsetY=0,lastEdge=0;
 const icons=()=>Array.from(grid.querySelectorAll('.app-icon'));

 function saveOrder(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(pages().map(p=>Array.from(p.querySelectorAll('.app-icon')).map(el=>el.dataset.app))))}catch(e){}
 }
 function restoreOrder(){

  order.forEach((list,index)=>{
   if(!Array.isArray(list)||!allPages[index])return;
   list.forEach(id=>{const el=byId.get(id);if(el&&!used.has(id)){allPages[index].appendChild(el);used.add(id)}});
  });
  icons().forEach(el=>{if(!used.has(el.dataset.app)){const page=allPages.find(p=>p.querySelectorAll('.app-icon').length<12)||allPages[allPages.length-1];page.appendChild(el)}});

 function updateDots(){

   done.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();setEditMode(false)});

 function clearPress(){if(pressTimer){clearTimeout(pressTimer);pressTimer=0}}
 function clearEdge(){if(edgeTimer){clearTimeout(edgeTimer);edgeTimer=0}lastEdge=0}

  const targetPage=target&&target.closest?target.closest('#appGrid .home-app-page'):null;

  }else if(targetPage&&!targetIcon){

   else{
    let nearest=children[0],best=Infinity;
    children.forEach(el=>{const r=el.getBoundingClientRect(),d=Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2));if(d<best){best=d;nearest=el}});

 document.addEventListener('pointerdown',e=>{
  if(!home.classList.contains('active')||e.button!==undefined&&e.button!==0&&e.pointerType==='mouse')return;

})();

(function(){
  const $ = (selector) => document.querySelector(selector);
  const phone = $('#phone');
  const cc = $('#controlCenter');
  if (!phone || !cc) return;

  const closeCC = () => { cc.classList.remove('active'); cc.setAttribute('aria-hidden', 'true'); };
  const openCC = () => { cc.classList.add('active'); cc.setAttribute('aria-hidden', 'false'); };

  function setFlashlight(enabled) {
    phone.classList.toggle('flashlight-on', Boolean(enabled));
    document.querySelectorAll('[data-toggle="flashlight"]').forEach((b) => {
      b.classList.toggle('on', Boolean(enabled));
      b.setAttribute('aria-pressed', String(Boolean(enabled)));
    });
    const lockButton = $('#flashlightButton');
    if (lockButton) lockButton.setAttribute('aria-pressed', String(Boolean(enabled)));
  }

  // One delegated handler means all controls work consistently on touch and mouse.
  document.addEventListener('click', (e) => {
    if (e.target.closest('.status')) { e.preventDefault(); openCC(); return; }
    if (e.target.closest('#ccDone, #ccClose')) { e.preventDefault(); closeCC(); return; }
    const tile = e.target.closest('[data-toggle]');
    if (tile) {
      const enabled = !tile.classList.contains('on');
      document.querySelectorAll('[data-toggle="' + tile.dataset.toggle + '"]').forEach((button) => {
        button.classList.toggle('on', enabled);
        button.setAttribute('aria-pressed', String(enabled));
      });
      if (tile.dataset.toggle === 'flashlight') setFlashlight(enabled);
      return;
    }
    if (e.target.closest('#flashlightButton')) {
      e.preventDefault(); setFlashlight(!phone.classList.contains('flashlight-on')); return;
    }
    if (e.target.closest('#lockCameraButton')) {
      e.preventDefault();
      const lock = $('#lock');
      if (lock && lock.classList.contains('active')) {
        cameraReturnToLock = true;
        closePasscode();
        showApp('camera');
      } else {
        cameraReturnToLock = false;
        showApp('camera');
      }
    }
  });

  const brightness = $('#brightnessControl');
  if (brightness) {
    const applyBrightness = () => {
      const raw = Number(brightness.value);
      const value = Number.isFinite(raw) ? Math.max(0, Math.min(100, raw)) : 100;
      const fill = document.querySelector('#controlCenter .cc-brightness'); if(fill) fill.style.setProperty('--cc-fill', value+'%');
      phone.style.setProperty('--screen-brightness', String(value / 100));
      brightness.setAttribute('aria-valuenow', String(value));
      const output=$('#brightnessValue');if(output)output.textContent=value+'%';
    };
    brightness.addEventListener('input', applyBrightness);
    brightness.addEventListener('change', applyBrightness);
    // Reliable touch drag for vertical brightness slider on mobile browsers.
    const brightnessTrack = document.querySelector('#controlCenter .cc-brightness');
    if (brightnessTrack && !brightness.dataset.verticalDragReady) {
      brightness.dataset.verticalDragReady = '1';
      let draggingBrightness = false;
      const setBrightnessFromY = (clientY) => {
        const rect = brightnessTrack.getBoundingClientRect();
        if (!rect.height) return;
        const ratio = Math.max(0, Math.min(1, (rect.bottom - clientY) / rect.height));
        const min = Number(brightness.min) || 0;
        const max = Number(brightness.max) || 100;
        brightness.value = String(Math.round(min + ratio * (max - min)));
        applyBrightness();
      };
      // Track-level pointer handling avoids native range hit-testing conflicts on touch screens.
      brightnessTrack.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        draggingBrightness = true;
        event.preventDefault();
        try { brightnessTrack.setPointerCapture(event.pointerId); } catch (_) {}
        setBrightnessFromY(event.clientY);
      });
      brightnessTrack.addEventListener('pointermove', (event) => {
        if (!draggingBrightness) return;
        event.preventDefault();
        setBrightnessFromY(event.clientY);
      });
      const stopBrightnessDrag = () => { draggingBrightness = false; };
      brightnessTrack.addEventListener('pointerup', stopBrightnessDrag);
      brightnessTrack.addEventListener('pointercancel', stopBrightnessDrag);
      brightnessTrack.addEventListener('lostpointercapture', stopBrightnessDrag);
    }
    applyBrightness();
  }
  const volumeInputs=Array.from(document.querySelectorAll('#volumeControl,#volumeControl2'));
  function syncVolume(source){const slider=document.querySelector('#controlCenter .cc-volume');if(slider)slider.style.setProperty('--cc-fill',source.value+'%');volumeInputs.forEach(el=>{if(el!==source)el.value=source.value});['#volumeValue','#volumeValue2'].forEach(sel=>{const o=$(sel);if(o)o.textContent=source.value+'%'})}
  volumeInputs.forEach(el=>{el.addEventListener('input',()=>syncVolume(el));el.addEventListener('change',()=>syncVolume(el))});
  const ccPages=$('#ccPages'),ccIndicators=Array.from(document.querySelectorAll('#ccPageIndicator [data-page]'));
  if(ccPages){
    ccPages.addEventListener('scroll',()=>{const index=0;ccIndicators.forEach((b,i)=>b.classList.toggle('active',i===index))},{passive:true});
    ccIndicators.forEach(b=>b.addEventListener('click',()=>{ccPages.scrollTo({left:Number(b.dataset.page)*ccPages.clientWidth,behavior:'smooth'})}));
  }
  const play=$('#ccPlay');if(play)play.addEventListener('click',()=>{const playing=play.textContent==='Ⅱ';play.textContent=playing?'▶':'Ⅱ';const track=$('.cc-track small');if(track)track.textContent=playing?'選擇音樂以開始播放':'播放介面示範中'});

  // Media transport controls are interactive even though they are not toggle tiles.
  const mediaButtons=document.querySelectorAll('#controlCenter .cc-media-buttons button');

  const notesTool=document.querySelector('[data-toggle="notes"]');if(notesTool)notesTool.addEventListener('click',()=>{closeCC();showApp('notes')});

  const weather = $('#lockWeather'), event = $('#lockEvent');
  if (weather) weather.textContent = (CONFIG.weather?.desc || '晴朗') + ' · ' + (CONFIG.weather?.temp || '24°');

  // Face ID gesture: pull down from the top-right edge to open Control Center;
  // swipe up from anywhere in Control Center to dismiss it.
  let gestureStart = null;

<script>
(function phoneRecoveryBootstrap(){
  'use strict';
  const byId = id => document.getElementById(id);
  const wallpaperUrl = 'https://raw.githubusercontent.com/yinofajianghu/-/main/image/Toya-background.png';
  const fallbackBackground = 'url("' + wallpaperUrl + '"), radial-gradient(ellipse at 18% 15%,#8fc8e6 0%,transparent 35%), radial-gradient(ellipse at 80% 35%,#6f79bd 0%,transparent 35%), linear-gradient(145deg,#344f71,#4c4778 55%,#19283f)';
  function paintBackground(){
    const wall = byId('wallpaper');
    if (wall) wall.style.setProperty('--wallpaper', fallbackBackground);
  }
  function paintClock(){
    const now = new Date();
    const time = now.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});
    const date = now.toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'long'});
    const lockTime = byId('lockTime'), statusTime = byId('statusTime'), lockDate = byId('lockDate');
    if (lockTime) lockTime.textContent = time;
    if (statusTime) statusTime.textContent = time;
    if (lockDate) lockDate.textContent = date;
  }
  paintBackground();
  paintClock();
  window.setInterval(paintClock,1000);

  if (window.__phoneMainReady) return;

  // If the main initializer stopped early, rebuild the home icons when possible.
  try {
    const grid = byId('appGrid');
    if (grid && !grid.querySelector('.app-icon') && typeof window.initHome === 'function') window.initHome();
  } catch (error) { console.error('Home recovery failed',error); }

  let fallbackDigits = '';
  function showPasscode(){
    const screen = byId('passcodeScreen');
    if (typeof window.openPasscode === 'function') { window.openPasscode(); return; }
    if (screen) { screen.classList.add('active'); screen.setAttribute('aria-hidden','false'); }
  }
  function unlockFallback(){
    const lock=byId('lock'), home=byId('home'), app=byId('appView'), screen=byId('passcodeScreen');
    if(screen){screen.classList.remove('active');screen.setAttribute('aria-hidden','true');}
    if(typeof window.unlock === 'function') window.unlock();
    window.setTimeout(()=>{
      if(lock) lock.classList.remove('active','unlocking','dragging');
      if(home) home.classList.add('active');
      if(app) app.classList.remove('active');
    },350);
  }
  document.addEventListener('click',function(event){
    const unlockTarget = event.target.closest && event.target.closest('#unlockPrompt,#lockBar,.lock-time,.lock-date');
    if(unlockTarget && byId('lock')?.classList.contains('active')){
      event.preventDefault(); event.stopPropagation();
      if(!byId('passcodeScreen')?.classList.contains('active')) { fallbackDigits=''; showPasscode(); }
      return;
    }
    const cancelTarget = event.target.closest && event.target.closest('#passcodeCancel');
    if(cancelTarget && byId('passcodeScreen')?.classList.contains('active')){
      event.preventDefault(); event.stopPropagation(); fallbackDigits='';
      if(typeof window.closePasscode==='function') window.closePasscode();
      else {const screen=byId('passcodeScreen');if(screen){screen.classList.remove('active');screen.setAttribute('aria-hidden','true');}}
      return;
    }
    const deleteTarget = event.target.closest && event.target.closest('#passcodeDelete');
    if(deleteTarget && byId('passcodeScreen')?.classList.contains('active')){
      // Let the main passcode handler process this control when it is available.
      if(typeof window.enterPasscodeDigit==='function') return;
      event.preventDefault(); event.stopPropagation();
      fallbackDigits=fallbackDigits.slice(0,-1);
      const dots=byId('passcodeDots');if(dots)dots.querySelectorAll('.passcode-dot').forEach((dot,index)=>dot.classList.toggle('filled',index<fallbackDigits.length));
      return;
    }
    const digitTarget = event.target.closest && event.target.closest('#passcodePad [data-digit]');
    if(digitTarget && byId('passcodeScreen')?.classList.contains('active')){
      // Do not shadow or duplicate the main keypad handler and its confirmation flow.
      if(typeof window.enterPasscodeDigit==='function') return;
      event.preventDefault(); event.stopPropagation();
      const digit = digitTarget.getAttribute('data-digit');
      if(!/^[0-9]$/.test(String(digit)) || fallbackDigits.length>=4) return;
      fallbackDigits += String(digit);
      if(typeof window.enterPasscodeDigit === 'function') window.enterPasscodeDigit(digit);
      else {
        const dots=byId('passcodeDots');
        if(dots){dots.querySelectorAll('.passcode-dot').forEach((dot,index)=>dot.classList.toggle('filled',index<fallbackDigits.length));}
      }
      if(fallbackDigits.length===4){
        if(fallbackDigits==='0525') window.setTimeout(unlockFallback,350);
        else { fallbackDigits=''; }
      }
    }
  },true);
  // Accept an upward swipe anywhere on the active lock screen, not only on the home indicator.
  let recoverySwipeStart = null;
  document.addEventListener('touchstart', function(event) {
    if (!byId('lock')?.classList.contains('active') || byId('passcodeScreen')?.classList.contains('active') || byId('controlCenter')?.classList.contains('active') || event.target.closest?.('#controlCenter, .status')) {
      recoverySwipeStart = null; return;
    }
    const touch = event.changedTouches[0];
    recoverySwipeStart = touch ? {x: touch.clientX, y: touch.clientY} : null;
  }, {capture:true, passive:true});
  document.addEventListener('touchend', function(event) {
    if (!recoverySwipeStart || !byId('lock')?.classList.contains('active') || byId('passcodeScreen')?.classList.contains('active')) {
      recoverySwipeStart = null; return;
    }
    const touch = event.changedTouches[0];
    const dx = Math.abs((touch?.clientX ?? recoverySwipeStart.x) - recoverySwipeStart.x);
    const dy = recoverySwipeStart.y - (touch?.clientY ?? recoverySwipeStart.y);
    recoverySwipeStart = null;
    if (dy > Math.max(35, window.innerHeight * 0.04) && dy > dx * 1.15) {
      event.preventDefault();
      event.stopImmediatePropagation();
      if (typeof window.openPasscode === 'function') window.openPasscode();
      else {
        const screen = byId('passcodeScreen');
        if (screen) { screen.classList.add('active'); screen.setAttribute('aria-hidden', 'false'); }
      }
    }
  }, {capture:true, passive:false});
  document.addEventListener('touchcancel', function() { recoverySwipeStart = null; }, {capture:true, passive:true});
  document.addEventListener('keydown',function(event){
    if(event.key==='Escape' && byId('passcodeScreen')?.classList.contains('active')){
      if(typeof window.closePasscode==='function') window.closePasscode();
      else {const screen=byId('passcodeScreen');screen.classList.remove('active');screen.setAttribute('aria-hidden','true');}
    }
  },true);
})();
</script>

.wx-temp{font-size:86px;font-weight:200;line-height:1.04;letter-spacing:-5px}
.wx-condition{font-size:18px;font-weight:500}
.wx-hilo{font-size:15px;color:#ffffffed;margin-top:7px}

.wx-hour i{width:38px;height:36px;display:flex;align-items:center;justify-content:center;font-style:normal;background:transparent!important;background-color:transparent!important;border:0!important;box-shadow:none!important;border-radius:0!important;padding:0!important;overflow:visible}

.wx-map .wx-map-fallback{position:absolute;inset:0;display:grid;place-items:center;color:#46677a;text-align:center;padding:20px}
.wx-map-controls{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.wx-map-controls .wx-chip{margin:0}
.wx-note{font-size:12px;line-height:1.55}
.wx-screen .wx-panel{margin-top:12px}
.wx-screen [data-close]{font-size:29px;line-height:1}

.wx-screen button,.wx-hour,.wx-day,.wx-detail{touch-action:manipulation}
.wx-temp,.wx-value{font-variant-numeric:tabular-nums}
.wx-empty{padding:25px 12px;text-align:center;color:#e7f4ff;font-size:13px}

 function getWx(){try{return typeof wx!=="undefined"?wx:null}catch(e){return null}}
 function timeClass(){
  const w=getWx(), current=mins(w&&w.localTime), now=current===null?(new Date().getHours()*60+new Date().getMinutes()):current;
  const rise=mins(w&&w.sunrise),set=mins(w&&w.sunset);
  if(rise===null||set===null)return now<360||now>=1140?"wx-time-night":"wx-time-day";
  if(now<rise-45||now>=set+45)return "wx-time-night";
  if(now<rise+55)return "wx-time-dawn";
  if(now>set-55&&now<set+45)return "wx-time-dusk";
  return "wx-time-day";
 }
 function weatherClass(app,w){
  app.classList.remove("wx-clear","wx-partly","wx-cloudy","wx-fog","wx-rain","wx-snow","wx-storm");
  const c=Number(w&&w.code)||0;
  app.classList.add(c===0?"wx-clear":c<=2?"wx-partly":c===3?"wx-cloudy":c<=48?"wx-fog":c<=67?"wx-rain":c<=77?"wx-snow":c<=82?"wx-rain":c<=86?"wx-snow":"wx-storm");

  const app=document.querySelector("#appView .wx-app");if(!app)return;
  const w=getWx();

  app.classList.add(timeClass());
  // The old manual night preference was forcing a dark palette during daytime.
  app.classList.remove("night");
  if(w)weatherClass(app,w);
  const scene=app.querySelector(".wx-atmo-scene");
  if(scene){scene.dataset.weather=String(Number(w&&w.code)||0);scene.dataset.time=w&&w.localTime||""}

})();</script>

<script id="ios-weather-video-backgrounds-controller">
(function(){
 const sources={
  sunny:"https://raw.githubusercontent.com/mawaqit/mobile-assets/main/weather-videos/sunny.mp4",
  cloudy:"https://raw.githubusercontent.com/mawaqit/mobile-assets/main/weather-videos/cloudy.mp4",
  overcast:"https://raw.githubusercontent.com/mawaqit/mobile-assets/main/weather-videos/overcast.mp4",
  light_rain:"https://raw.githubusercontent.com/mawaqit/mobile-assets/main/weather-videos/light_rain.mp4",
  rain:"https://raw.githubusercontent.com/mawaqit/mobile-assets/main/weather-videos/rain.mp4",
  snow:"https://raw.githubusercontent.com/mawaqit/mobile-assets/main/weather-videos/snow.mp4",
  thunderstorm:"https://raw.githubusercontent.com/mawaqit/mobile-assets/main/weather-videos/thunderstorm.mp4"

 function sceneFor(code){code=Number(code)||0;if(code===0)return "sunny";if(code<=2)return "cloudy";if(code===3)return "overcast";if(code<=48)return "overcast";if(code<=57)return "light_rain";if(code<=67)return "rain";if(code<=77)return "snow";if(code<=82)return "rain";if(code<=86)return "snow";return "thunderstorm"}

 function polishRain(){

  app.querySelectorAll(".wx-day").forEach(el=>{const small=el.querySelector("small");if(!small)return;const m=small.textContent.match(/(\d+(?:\.\d+)?)\s*%/);if(!m)return;const label=rainLabel(m[1]);if(small.textContent!==label)small.textContent=label;small.style.display=label?"":"none"});
  app.querySelectorAll(".wx-detail").forEach(el=>{const label=el.querySelector(".wx-label"),value=el.querySelector(".wx-value");if(!label||!value||!label.textContent.includes("降雨機率"))return;const m=value.textContent.match(/(\d+(?:\.\d+)?)\s*%/);if(!m)return;const out=rainLabel(m[1]);value.textContent=out;el.style.display=out?"":"none"});

/* Real moving background rain: each streak is an element translated down the scene. */
#appView .wx-atmo-scene .rain{
  background:none!important;
  -webkit-mask-image:none!important;
  mask-image:none!important;
  overflow:hidden!important;
  contain:layout paint;
}

#appView .wx-atmo-scene .rain .wx-rain-drop{
  position:absolute!important;display:block!important;top:-24px!important;left:var(--drop-x)!important;
  width:1.2px!important;height:var(--drop-length)!important;border-radius:2px!important;
  background:linear-gradient(180deg,rgba(231,244,252,0),rgba(231,244,252,.78) 35%,rgba(248,252,255,.95))!important;
  opacity:var(--drop-opacity)!important;pointer-events:none!important;
  transform:translate3d(0,0,0);will-change:transform;
  animation:wxIndividualDropFall var(--drop-duration) linear var(--drop-delay) infinite!important;
}
#appView .wx-atmo-scene .rain .wx-rain-drop.depth-far{width:.8px!important;filter:blur(.25px)}
#appView .wx-atmo-scene .rain .wx-rain-drop.depth-near{width:1.7px!important;filter:blur(.15px)}

  from{transform:translate3d(0,-4vh,0)}
  to{transform:translate3d(0,125vh,0)}
}
</style>
<script id="wx-true-falling-rain-script">
(function(){
  function buildRain(){
    document.querySelectorAll("#appView .wx-atmo-scene .rain").forEach(function(layer){
      if(layer.dataset.realDropsBuilt==="1")return;
      layer.dataset.realDropsBuilt="1";
      var frag=document.createDocumentFragment();
      for(var i=0;i<105;i++){
        var drop=document.createElement("i");
        drop.className="wx-rain-drop "+(i%9===0?"depth-near":i%3===0?"depth-far":"");
        drop.setAttribute("aria-hidden","true");
        drop.style.setProperty("--drop-x",(Math.random()*100)+"%");
        drop.style.setProperty("--drop-length",(7+Math.random()*13)+"px");
        drop.style.setProperty("--drop-duration",(0.48+Math.random()*0.62)+"s");
        drop.style.setProperty("--drop-delay",(-Math.random()*1.1)+"s");
        drop.style.setProperty("--drop-opacity",(0.28+Math.random()*0.64).toFixed(2));
        frag.appendChild(drop);
      }
      layer.appendChild(frag);
    });
  }
  function start(){
    buildRain();
    var root=document.querySelector("#appView");
    if(root)new MutationObserver(function(){buildRain()}).observe(root,{childList:true,subtree:true});
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start,{once:true});else start();
})();
</script>

 if(kind==='privacy'){const box=document.createElement('div');box.className='sf-privacy-report';box.innerHTML='<h4>隱私權報告</h4><p>智慧防止追蹤：此模擬器未實作真實追蹤器辨識或阻擋。</p><p>已阻擋追蹤器：<b>無可驗證資料</b></p><p>資料來源：本模擬器的本機狀態；不是 iOS Safari 的系統報告。</p><p>網站是否使用追蹤器尚未檢測，不能將數字視為實際阻擋量。</p>';p.append(box)}
 else if(kind==='settings'){const box=document.createElement('div');box.className='sf-settings';Object.keys(state.settings.sections).forEach(k=>{const names={favs:'喜好項目',suggestions:'建議',privacy:'隱私權報告',closed:'最近關閉的標籤頁',reading:'閱讀列表'};const lab=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.checked=state.settings.sections[k];cb.onchange=()=>{state.settings.sections[k]=cb.checked;save();renderPage();showPanel('settings')};lab.append(cb,document.createTextNode(names[k]));box.append(lab)});const bg=document.createElement('input');bg.placeholder='背景圖片網址（https://…）';bg.value=state.settings.background||'';const apply=button('套用背景',()=>{const u=bg.value.trim();if(u&&!/^https:\/\//i.test(u)){notice('背景圖片請使用 https 網址。');return}if(u&&!httpURL(u)){notice('請輸入有效的 HTTPS 圖片網址。');return}state.settings.background=u;save();renderPage();showPanel('settings')});const dark=button(state.settings.dark?'切換淺色模式':'切換深色模式',()=>{state.settings.dark=!state.settings.dark;save();app.classList.toggle('sf-dark',state.settings.dark);showPanel('settings')});box.append(bg,apply,dark);p.append(box)}
