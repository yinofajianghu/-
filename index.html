function listCards(arr){return '<div class="grid">'+arr.map(v=>card(v,videos.indexOf(v))).join("")+'</div>';}
function chips(){const cats=["全部","音樂","遊戲","直播中","旅遊","自然","學習","電影","生活","最近上傳"];return '<div class="chips">'+cats.map(c=>'<button class="chip '+(state.category===c?'active':'')+'" data-category="'+esc(c)+'">'+esc(c)+'</button>').join("")+'</div>';}
function home(){let arr=videos.filter(v=>state.category==="全部"||state.category==="最近上傳"||state.category==="直播中"&&v.duration==="LIVE"||v.category===state.category);if(state.query)arr=arr.filter(v=>(v.title+" "+v.channel+" "+v.category).toLowerCase().includes(state.query.toLowerCase()));return chips()+listCards(arr.length?arr:videos);}
function navActive(){document.querySelectorAll("[data-page]").forEach(el=>el.classList.toggle("active",el.dataset.page===state.page));}
function shortPage(){const s=shorts[state.short%shorts.length];return '<div class="shorts-shell"><div class="short-video"><img src="'+esc(s.img)+'" alt=""><div class="short-gradient"></div><div class="short-info"><b>@'+esc(s.channel)+'</b><div>'+esc(s.title)+'</div><p>'+esc(s.desc)+'</p><div>♫ 原始音訊 - '+esc(s.channel)+'</div></div><div class="short-actions"><button data-action="short-like">♥</button><span>'+s.likes+'</span><button data-action="short-comment">▢</button><span>留言</span><button data-action="short-share">↗</button><span>分享</span><button data-action="short-more">⋮</button></div></div><div class="short-arrow"><button data-action="short-next">⌄</button><button data-action="short-prev">⌃</button></div></div>';}
function watchPage(){const v=activeVideo();const liked=state.liked.includes(v.id),saved=state.saved.includes(v.id),sub=state.subscribed.includes(v.channel);const rec=videos.filter((x,i)=>i!==state.video);const comments=state.comments.filter(c=>c.video===v.id);return '<div class="watch"><section><div class="player"><img src="'+esc(v.img)+'" alt=""><button class="playbig" data-action="play">▶</button></div><div class="watch-inner"><h1 class="watch-title">'+esc(v.title)+'</h1><div class="watch-actions"><button class="pill" data-action="channel">'+avatar(v).replace('channel-avatar','channel-avatar')+' <span>'+esc(v.channel)+'</span></button><button class="btn '+(sub?'dark':'')+'" data-action="subscribe">'+(sub?'已訂閱':'訂閱')+'</button><button class="pill '+(liked?'selected':'')+'" data-action="like">👍　'+(liked?'已喜歡':'喜歡')+'</button><button class="pill" data-action="dislike">👎</button><button class="pill" data-action="share">↗　分享</button><button class="pill '+(saved?'selected':'')+'" data-action="save">▤　'+(saved?'已儲存':'儲存')+'</button><button class="pill" data-action="more-video">⋯</button></div><div class="channelrow"><div class="channel-avatar">'+esc(v.avatar)+'</div><div class="channelinfo"><b>'+esc(v.channel)+'</b><span class="muted">創作者 · 影片頻道</span></div></div><div class="description">'+esc(v.views+' · '+v.age)+'\\n'+esc(v.desc)+'\\n\\n顯示更多</div><div class="comments"><h3>留言　'+(comments.length+128)+'</h3><div class="comment-input"><div class="avatar">A</div><input id="commentInput" placeholder="新增留言..."><button class="btn" data-action="comment-send">留言</button></div>'+(comments.length?comments.map(c=>'<div class="comment"><div class="avatar">A</div><div><b>你　<span class="muted">剛剛</span></b><p>'+esc(c.text)+'</p><span class="muted">♡　回覆</span></div></div>').join(""):'<div class="comment"><div class="avatar">Y</div><div><b>YouTube 觀眾</b><p>歡迎分享你的想法，友善交流。</p><span class="muted">♡　回覆</span></div></div>')+'</div></div></section><aside class="watch-recommend">'+rec.map(x=>'<div class="recommend" data-video="'+videos.indexOf(x)+'"><img src="'+esc(x.img)+'" alt=""><div><div class="video-title">'+esc(x.title)+'</div><div class="muted">'+esc(x.channel)+'<br>'+esc(x.views)+' · '+esc(x.age)+'</div></div></div>').join("")+'</aside></div>';}
function subscriptions(){const subs=videos.filter(v=>state.subscribed.includes(v.channel));return '<div class="page"><h1 class="page-title">訂閱內容</h1><div class="mobile-subnav">'+videos.slice(0,6).map(v=>'<button class="pill" data-channel="'+esc(v.channel)+'">'+esc(v.avatar)+' '+esc(v.channel)+'</button>').join("")+'</div><div class="tabs"><button class="active">全部</button><button>今天</button><button>繼續觀看</button></div>'+(subs.length?listCards(subs):'<div class="empty"><div class="big">▣</div><h3>最新影片會顯示在這裡</h3><p>訂閱你喜歡的頻道，即可在這裡查看最新內容。</p><button class="btn" data-page="home">探索影片</button></div>')+'</div>';}
function youPage(){return '<div class="page"><div class="profile-head"><div class="profile-big">A</div><div><h1 style="margin:0 0 6px">你的 YouTube</h1><div class="muted">個人帳戶 · 本機介面示範</div><p><button class="pill" data-action="channel-own">你的頻道　›</button> <button class="pill" data-page="settings">管理帳戶</button></p></div></div><div class="tabs"><button class="active" data-page="you">總覽</button><button data-page="history">觀看紀錄</button><button data-page="playlists">播放清單</button></div><div class="section-heading" style="padding-left:0">你的內容</div><div class="rowcard" data-page="history"><div style="font-size:28px;width:45px">◷</div><div class="grow"><b>觀看紀錄</b><div class="muted">你最近觀看的影片</div></div>›</div><div class="rowcard" data-page="playlists"><div style="font-size:28px;width:45px">☷</div><div class="grow"><b>播放清單</b><div class="muted">已儲存的影片和播放清單</div></div>›</div><div class="rowcard" data-page="liked"><div style="font-size:28px;width:45px">♡</div><div class="grow"><b>喜歡的影片</b><div class="muted">'+state.liked.length+' 部影片</div></div>›</div><div class="rowcard" data-page="watchlater"><div style="font-size:28px;width:45px">◴</div><div class="grow"><b>稍後觀看</b><div class="muted">'+state.saved.length+' 部影片</div></div>›</div><div class="rowcard" data-page="settings"><div style="font-size:28px;width:45px">⚙</div><div class="grow"><b>設定</b><div class="muted">外觀、通知與播放偏好設定</div></div>›</div></div>';}
function historyPage(){const arr=state.history.map(id=>videos.find(v=>v.id===id)).filter(Boolean);return '<div class="page"><h1 class="page-title">觀看紀錄</h1><p class="muted">最近觀看的影片</p>'+(arr.length?arr.map(v=>'<div class="rowcard" data-video="'+videos.indexOf(v)+'"><img src="'+esc(v.img)+'"><div class="grow"><div class="video-title">'+esc(v.title)+'</div><div class="muted">'+esc(v.channel)+' · '+esc(v.views)+'</div></div></div>').join(""):'<div class="empty"><div class="big">◷</div><h3>尚無觀看紀錄</h3><p>你觀看的影片會顯示在這裡。</p><button class="btn" data-page="home">開始探索</button></div>')+'<p><button class="pill" data-action="clear-history">清除觀看紀錄</button></p></div>';}
function collectionPage(which){let arr=which==="liked"?videos.filter(v=>state.liked.includes(v.id)):which==="watchlater"?videos.filter(v=>state.saved.includes(v.id)):which==="myvideos"?[]:videos.filter(v=>state.saved.includes(v.id));let title=which==="liked"?"喜歡的影片":which==="watchlater"?"稍後觀看":which==="myvideos"?"你的影片":"播放清單";return '<div class="page"><h1 class="page-title">'+title+'</h1>'+(arr.length?listCards(arr):'<div class="empty"><div class="big">☷</div><h3>這裡目前還沒有內容</h3><p>在影片頁面按下「儲存」或「喜歡」，就會顯示在這裡。</p><button class="btn" data-page="home">瀏覽影片</button></div>')+'</div>';}
function channelPage(){const ch=state.channel;const arr=videos.filter(v=>v.channel===ch);return '<div class="page"><div class="profile-head"><div class="profile-big">'+esc((ch||"Y").slice(0,1))+'</div><div><h1 style="margin:0 0 6px">'+esc(ch||"YouTube 頻道")+'</h1><div class="muted">@'+esc((ch||"channel").replace(/\s/g,""))+' · '+(arr.length*120+1200)+' 位訂閱者</div><p>分享喜歡的影片與日常靈感。</p><button class="btn '+(state.subscribed.includes(ch)?'dark':'')+'" data-action="subscribe-channel">'+(state.subscribed.includes(ch)?'已訂閱':'訂閱')+'</button></div></div><div class="tabs">'+["首頁","影片","Shorts","直播","播放清單"].map((t,i)=>'<button class="'+(state.activeTab===t?'active':'')+'" data-ctab="'+t+'">'+t+'</button>').join("")+'</div>'+listCards(arr.length?arr:videos.slice(0,4))+'</div>';}
function notifications(){return '<div class="page"><h1 class="page-title">通知</h1><div class="notice"><div class="notice-icon">▶</div><div class="grow"><b>歡迎使用 YouTube 介面</b><div class="muted">你可以在這裡查看頻道更新與通知。</div><div class="muted">現在</div></div></div><div class="notice"><div class="notice-icon">♡</div><div class="grow"><b>你的個人化推薦已準備好</b><div class="muted">瀏覽影片並探索感興趣的主題。</div><div class="muted">今天</div></div></div></div>';}
function settingsPage(){return '<div class="page"><h1 class="page-title">設定</h1><div class="rowcard"><div style="font-size:25px;width:40px">◉</div><div class="grow"><b>帳戶</b><div class="muted">管理你的本機介面偏好</div></div></div><div class="rowcard"><div style="font-size:25px;width:40px">◐</div><div class="grow"><b>外觀</b><div class="muted">選擇深色或淺色主題</div></div><button class="pill" data-action="theme">'+(state.theme==="dark"?"深色模式":"淺色模式")+'</button></div><div class="rowcard"><div style="font-size:25px;width:40px">▶</div><div class="grow"><b>播放</b><div class="muted">播放介面與預覽設定</div></div><button class="pill" data-action="setting-info">管理</button></div><div class="rowcard"><div style="font-size:25px;width:40px">♧</div><div class="grow"><b>通知</b><div class="muted">頻道與活動通知</div></div><button class="pill" data-page="notifications">查看</button></div><p class="muted">此網站為 YouTube 風格介面示範，不會連結真實帳戶或保存到 YouTube。</p><button class="pill" data-action="reset">重設本機示範資料</button></div>';}
function searchPage(){let arr=videos.filter(v=>(v.title+" "+v.channel+" "+v.category).toLowerCase().includes(state.query.toLowerCase()));return '<div class="page"><h1 class="page-title">搜尋結果</h1><div class="muted">搜尋：'+esc(state.query)+'</div>'+(arr.length?arr.map(v=>'<div class="rowcard" data-video="'+videos.indexOf(v)+'"><img src="'+esc(v.img)+'"><div class="grow"><div class="video-title">'+esc(v.title)+'</div><div class="muted">'+esc(v.channel)+' · '+esc(v.views)+' · '+esc(v.age)+'</div><p class="muted">'+esc(v.desc)+'</p></div></div>').join(""):'<div class="empty">找不到符合的影片，請嘗試其他關鍵字。</div>')+'</div>';}
function pageHTML(){switch(state.page){case"home":return home();case"shorts":return shortPage();case"watch":return watchPage();case"subscriptions":return subscriptions();case"you":return youPage();case"history":return historyPage();case"playlists":case"watchlater":case"liked":case"myvideos":return collectionPage(state.page);case"channel":return channelPage();case"notifications":return notifications();case"settings":return settingsPage();case"search":return searchPage();case"trending":return '<div class="section-heading">發燒影片</div>'+listCards(videos.slice().reverse());case"music":case"gaming":return '<div class="section-heading">'+(state.page==="music"?"音樂":"遊戲")+'</div>'+listCards(videos.filter(v=>state.page==="music"?v.category==="音樂":v.category==="電影"));case"feedback":return '<div class="page"><h1 class="page-title">提供意見</h1><p>告訴我們如何改善這個介面。</p><textarea id="feedbackText" style="width:100%;height:120px;background:#222;color:white;border:1px solid #555;border-radius:8px;padding:12px"></textarea><p><button class="btn" data-action="send-feedback">送出意見</button></p></div>';default:return home();}}
function render(){document.body.classList.toggle("light",state.theme==="light");document.documentElement.style.setProperty("--bg",state.theme==="light"?"#fff":"#0f0f0f");document.documentElement.style.setProperty("--text",state.theme==="light"?"#0f0f0f":"#f1f1f1");document.documentElement.style.setProperty("--muted",state.theme==="light"?"#606060":"#aaa");document.documentElement.style.setProperty("--line",state.theme==="light"?"#ddd":"#303030");document.documentElement.style.setProperty("--panel",state.theme==="light"?"#f2f2f2":"#212121");$("#content").innerHTML=pageHTML();navActive();$("#content").scrollTop=0;const si=$("#searchInput");if(si&&state.page==="search")si.value=state.query;}
function go(page){state.page=page;state.modal="";render();}
function openVideo(i){state.video=Math.max(0,Math.min(videos.length-1,Number(i)||0));state.page="watch";state.history.unshift(activeVideo().id);state.history=state.history.slice(0,30);save();render();}
function runSearch(){const input=$("#searchInput");const q=(input&&input.value||state.query||"").trim();state.query=q;go("search");}
function toggleList(key,value){const a=state[key];state[key]=a.includes(value)?a.filter(x=>x!==value):a.concat(value);save();render();}
function showModal(title,body,buttons){$("#overlay").innerHTML='<div class="modal-back" data-action="overlay-close"><div class="modal" data-modal><h2>'+esc(title)+'</h2>'+body+'<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px">'+buttons+'</div></div></div>';}
function closeModal(){$("#overlay").innerHTML="";}
document.addEventListener("click",function(e){
const video=e.target.closest("[data-video]");if(video){if(e.target.closest("[data-more]")){const i=Number(e.target.closest("[data-more]").dataset.more);state.video=i;showModal("更多選項",'<p>'+esc(videos[i].title)+'</p>','<button class="pill" data-action="save">▤ 稍後觀看</button><button class="btn" data-action="modal-close">關閉</button>');return;}openVideo(video.dataset.video);return;}
const cat=e.target.closest("[data-category]");if(cat){state.category=cat.dataset.category;render();return;}
const page=e.target.closest("[data-page]");if(page){go(page.dataset.page);return;}
const ch=e.target.closest("[data-channel]");if(ch){state.channel=ch.dataset.channel;go("channel");return;}
const ctab=e.target.closest("[data-ctab]");if(ctab){state.activeTab=ctab.dataset.ctab;render();return;}
const a=e.target.closest("[data-action]");if(!a)return;const action=a.dataset.action;
if(action==="home")go("home");
else if(action==="menu"){state.menu=!state.menu;$("#sidebar").style.display=state.menu?"":"none";if(window.innerWidth<=680)toast(state.menu?"選單已開啟":"選單已收合");}
else if(action==="search"||action==="mobile-search"){if(action==="mobile-search"){showModal("搜尋 YouTube",'<input id="modalSearch" placeholder="搜尋影片、頻道或主題" value="'+esc(state.query)+'">','<button class="pill" data-action="modal-close">取消</button><button class="btn" data-action="modal-search">搜尋</button>');}else runSearch();}
else if(action==="voice"){toast("語音搜尋需要裝置的麥克風權限");}
else if(action==="create"){showModal("建立",'<div class="rowcard" data-action="upload"><div class="notice-icon">▣</div><div><b>上傳影片</b><div class="muted">選擇裝置上的影片檔案</div></div></div><div class="rowcard" data-action="short-create"><div class="notice-icon">▷</div><div><b>建立 Shorts</b><div class="muted">製作直式短影音</div></div></div>','<button class="pill" data-action="modal-close">取消</button>');}
else if(action==="notifications")go("notifications");
else if(action==="you")go("you");
else if(action==="play"){const v=activeVideo();showModal("播放影片",'<div style="aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden"><iframe width="100%" height="100%" src="https://www.youtube-nocookie.com/embed/'+esc(v.id)+'?autoplay=1" title="'+esc(v.title)+'" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><p class="muted">如果影片無法播放，可能是影片擁有者限制了嵌入播放。</p>','<button class="btn" data-action="modal-close">關閉播放器</button>');}
else if(action==="like")toggleList("liked",activeVideo().id);
else if(action==="save")toggleList("saved",activeVideo().id);
else if(action==="subscribe"){toggleList("subscribed",activeVideo().channel);toast(state.subscribed.includes(activeVideo().channel)?"已訂閱頻道":"已取消訂閱");}
else if(action==="channel"){state.channel=activeVideo().channel;go("channel");}
else if(action==="subscribe-channel"){toggleList("subscribed",state.channel);}
else if(action==="dislike"){toast("已記錄你的回饋");}
else if(action==="share"){showModal("分享",'<input id="shareUrl" readonly value="https://www.youtube.com/watch?v='+esc(activeVideo().id)+'">','<button class="pill" data-action="modal-close">取消</button><button class="btn" data-action="copy-link">複製連結</button>');}
else if(action==="more-video"){showModal("更多選項",'<div class="rowcard" data-action="save">▤　儲存至稍後觀看</div><div class="rowcard" data-action="share">↗　分享</div>','<button class="btn" data-action="modal-close">完成</button>');}
else if(action==="comment-send"){const input=$("#commentInput");const text=(input&&input.value||"").trim();if(text){state.comments.push({video:activeVideo().id,text:text});save();render();toast("留言已加入本機示範");}}
else if(action==="short-next"){state.short=(state.short+1)%shorts.length;render();}
else if(action==="short-prev"){state.short=(state.short+shorts.length-1)%shorts.length;render();}
else if(action==="short-like"){toast("已喜歡這部 Shorts");}
else if(action==="short-comment"){showModal("Shorts 留言",'<p>分享你的想法</p><input id="shortComment" placeholder="新增留言...">','<button class="pill" data-action="modal-close">取消</button><button class="btn" data-action="modal-close">送出</button>');}
else if(action==="short-share"){toast("已開啟分享選項");}
else if(action==="short-more"){showModal("Shorts 選項",'<p>你可以回報內容或管理推薦。</p>','<button class="btn" data-action="modal-close">關閉</button>');}
else if(action==="theme"){state.theme=state.theme==="dark"?"light":"dark";save();closeModal();render();}
else if(action==="setting-info"){toast("此為本機示範設定");}
else if(action==="clear-history"){state.history=[];save();render();toast("已清除本機觀看紀錄");}
else if(action==="reset"){state.liked=[];state.saved=[];state.subscribed=[];state.history=[];state.comments=[];state.theme="dark";save();render();toast("已重設本機示範資料");}
else if(action==="send-feedback"){toast("感謝你的意見");}
else if(action==="channel-own"){state.channel="你的頻道";go("channel");}
else if(action==="upload"){showModal("上傳影片",'<input type="file" accept="video/*" id="uploadFile"><p class="muted">此示範不會將影片上傳至 YouTube。</p>','<button class="pill" data-action="modal-close">取消</button><button class="btn" data-action="upload-done">完成</button>');}
else if(action==="upload-done"){closeModal();toast("示範上傳流程已結束，未上傳至 YouTube");}
else if(action==="short-create"){closeModal();go("shorts");}
else if(action==="modal-search"){const input=$("#modalSearch");state.query=(input&&input.value||"").trim();closeModal();go("search");}
else if(action==="copy-link"){const inp=$("#shareUrl");if(inp){inp.select();try{document.execCommand("copy");toast("連結已複製");}catch(err){toast("請手動複製連結");}}closeModal();}
else if(action==="modal-close")closeModal();
else if(action==="overlay-close"&&e.target.classList.contains("modal-back"))closeModal();
});
$("#searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")runSearch();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if(state.page==="shorts"&&e.key==="ArrowDown"){state.short=(state.short+1)%shorts.length;render();}if(state.page==="shorts"&&e.key==="ArrowUp"){state.short=(state.short+shorts.length-1)%shorts.length;render();}});
let touchY=0;$("#content").addEventListener("touchstart",e=>{touchY=e.touches[0].clientY;},{passive:true});$("#content").addEventListener("touchend",e=>{if(state.page!=="shorts")return;const dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dy)>50){state.short=(state.short+(dy<0?1:shorts.length-1))%shorts.length;render();}},{passive:true});
render();
})();
</script>
</body>
</html>
